packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

patchedDependencies:
  better-sqlite3@13.0.3: patches/better-sqlite3@13.0.3.patch

sharedWorkspaceLockfile: true

strictPeerDependencies: true

# Security floors for transitive dependencies. Keep fast-uri's major
# versions separate: Ajv uses 3.x; Fastify's compilers also use 4.x.
# GHSA-q2hr-2g5m-vwhr, GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p
# GHSA-hrr3-gc8f-f4qj, GHSA-jvvf-x445-j334
# GHSA-gxm5-99cw-xjw9, GHSA-68fv-2mgg-jv7q
# fast-uri: GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr,
# GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp
# Vite 8.2.4 fixes the dev-server/editor advisories on both the web and Vitest paths.
overrides:
  "brace-expansion@>=4.0.0 <5.0.12": "5.0.12"
  "fast-uri@>=3.0.0 <3.1.9": "3.1.9"
  "fast-uri@>=4.0.0 <4.2.3": "4.2.3"
  "@fastify/busboy@>=3.0.0 <3.2.2": "3.2.2"
  "source-map-js@>=1.0.0 <1.2.2": "1.2.2"
  "vite@>=8.0.0 <8.2.4": "8.2.4"

syncInjectedDepsAfterScripts:
  - build
