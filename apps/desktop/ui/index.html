<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#111513" />
    <title>TakeBoard</title>
    <link rel="stylesheet" href="bootstrap.css" />
  </head>
  <body>
    <main>
      <span class="mark">T</span>
      <p>TAKEBOARD DESKTOP</p>
      <h1>正在打开你的创作空间</h1>

      <small id="status">正在检查本机服务与数据目录…</small>
      <button id="retry" type="button" hidden>重新启动</button>
    </main>
    <script src="bootstrap.js"></script>
  </body>
</html>
