[package]
name = "takeboard-desktop"
version = "0.2.0-beta.1"
description = "Native desktop host for the TakeBoard local-first filmmaking workspace"
authors = ["TakeBoard contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
repository = "https://github.com/Fourques/Takeboard"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2"
