name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "patches/**"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/**"
      - "security/rust-advisory-exceptions.json"
      - "scripts/check-linux-desktop-advisory.mjs"
      - "scripts/check-rust-audit-report*.mjs"
      - "scripts/fastify-security.test.mjs"
      - "scripts/portal-dependency-security.test.mjs"
      - "scripts/contracts-dependency-security.test.mjs"
      - "scripts/media-dependency-security.test.mjs"
      - ".github/workflows/security-audit.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "patches/**"
      - "apps/desktop/src-tauri/Cargo.lock"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/src/**"
      - "security/rust-advisory-exceptions.json"
      - "scripts/check-linux-desktop-advisory.mjs"
      - "scripts/check-rust-audit-report*.mjs"
      - "scripts/fastify-security.test.mjs"
      - "scripts/portal-dependency-security.test.mjs"
      - "scripts/contracts-dependency-security.test.mjs"
      - "scripts/media-dependency-security.test.mjs"
      - ".github/workflows/security-audit.yml"

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Runtime and build dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reject known runtime and build Node.js vulnerabilities
        run: pnpm audit --audit-level=low
      - name: Verify dependency security regressions
        run: node --test scripts/fastify-security.test.mjs scripts/portal-dependency-security.test.mjs scripts/contracts-dependency-security.test.mjs scripts/media-dependency-security.test.mjs scripts/check-rust-audit-report.test.mjs
      - name: Enforce the bounded Linux GTK exception
        run: pnpm security:linux-desktop
      - name: Scan the full desktop lockfile against RustSec
        shell: bash
        run: |
          audit_dir="$(mktemp -d)"
          curl --fail --location --retry 3 --output "$audit_dir/cargo-audit.tgz" \
            https://github.com/RustSec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  $audit_dir/cargo-audit.tgz" | sha256sum --check
          tar -xzf "$audit_dir/cargo-audit.tgz" -C "$audit_dir"
          "$audit_dir/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" audit \
            --db "$audit_dir/advisory-db" --file apps/desktop/src-tauri/Cargo.lock --json \
            | node scripts/check-rust-audit-report.mjs
