name: Public website

on:
  push:
    branches: [main]
    paths:
      - site/**
      - scripts/build-public-site*
      - docs/media-kit.md
      - docs/assets/takeboard-demo-*
      - docs/assets/takeboard-product-walkthrough.webm
      - docs/assets/takeboard-film*
      - apps/web/public/takeboard-icon.svg
      - LICENSE
      - .github/workflows/public-site.yml
  pull_request:
    paths:
      - site/**
      - scripts/build-public-site*
      - docs/media-kit.md
      - docs/assets/takeboard-demo-*
      - docs/assets/takeboard-product-walkthrough.webm
      - docs/assets/takeboard-film*
      - .github/workflows/public-site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/build-public-site.test.mjs
      - run: node scripts/build-public-site.mjs
      - name: Package public media only
        working-directory: dist/site/media
        run: zip -X ../takeboard-media-kit.zip README.md LICENSE product.json takeboard-icon.svg takeboard-social.png takeboard-film.zh.mp4 takeboard-film.en.mp4 takeboard-film-poster.zh.jpg takeboard-film-poster.en.jpg takeboard-film-canvas.png takeboard-film-result.png takeboard-film.zh.vtt takeboard-film.en.vtt takeboard-film-manifest.json takeboard-film-credits.md
      - run: unzip -t dist/site/takeboard-media-kit.zip
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
