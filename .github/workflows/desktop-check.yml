name: Desktop check

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/portable-launcher.mjs"
      - "scripts/prepare-desktop-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/portable-launcher.mjs"
      - "scripts/prepare-desktop-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bundled runtime and Rust compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - run: pnpm install --frozen-lockfile
      - name: Build and verify embedded runtime
        run: pnpm desktop:prepare
      - name: Compile desktop host
        run: pnpm desktop:check
