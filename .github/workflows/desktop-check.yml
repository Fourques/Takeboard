name: Desktop check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/portable-launcher.mjs"
      - "scripts/desktop-connection*"
      - "scripts/remote-connection*"
      - "scripts/prepare-desktop-runtime.mjs"
      - "scripts/desktop-release-config*"
      - "scripts/verify-linux-desktop.mjs"
      - "scripts/verify-desktop-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-check.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/portable-launcher.mjs"
      - "scripts/desktop-connection*"
      - "scripts/remote-connection*"
      - "scripts/prepare-desktop-runtime.mjs"
      - "scripts/desktop-release-config*"
      - "scripts/verify-linux-desktop.mjs"
      - "scripts/verify-desktop-runtime.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-check.yml"

permissions:
  contents: read

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    name: Preview build and packaged runtime (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            bundles: dmg
            extension: dmg
            node: apps/desktop/src-tauri/target/release/bundle/macos/TakeBoard.app/Contents/MacOS/takeboard-node
            resources: apps/desktop/src-tauri/target/release/bundle/macos/TakeBoard.app/Contents/Resources/TakeBoard
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:prepare
      - name: Build preview installer (not a signed production release)
        run: pnpm --filter @takeboard/desktop exec tauri build --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Verify bundled runtime and real restart persistence
        if: runner.os == 'macOS'
        run: node scripts/verify-desktop-runtime.mjs "${{ matrix.node }}" "${{ matrix.resources }}"
      - name: Install Windows preview and verify the installed runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw "NSIS installer missing" }
          $destination = Join-Path $env:RUNNER_TEMP 'TakeBoard-preview-install'
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          node scripts/verify-desktop-runtime.mjs "$destination/takeboard-node.exe" "$destination/TakeBoard"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime verification failed" }
      - name: Write installer checksums
        run: node scripts/write-desktop-checksums.mjs apps/desktop/src-tauri/target/release/bundle
      - name: Preserve preview installers (unsigned / not notarized)
        uses: actions/upload-artifact@v7
        with:
          name: takeboard-preview-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.${{ matrix.extension }}
            apps/desktop/src-tauri/target/release/bundle/**/*.sha256
          if-no-files-found: error
          retention-days: 14

  check:
    name: Native build and installed Linux lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev xvfb xauth dbus-x11 openbox xdotool x11-utils imagemagick fonts-noto-cjk
      - run: pnpm install --frozen-lockfile
      - name: Build and verify embedded runtime
        run: pnpm desktop:prepare
      - name: Compile desktop host
        run: pnpm desktop:check
      - name: Build Debian installer
        run: pnpm --filter @takeboard/desktop exec tauri build --bundles deb --ci -- --locked
      - name: Install the actual package
        run: sudo apt-get install -y ./apps/desktop/src-tauri/target/release/bundle/deb/*.deb
      - name: Verify native window and process ownership
        run: xvfb-run -a -s '-screen 0 1600x1000x24' dbus-run-session -- node scripts/verify-linux-desktop.mjs
        env:
          TAKEBOARD_DESKTOP_SMOKE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: Preserve native screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-smoke
          path: test-results/linux-desktop/
          if-no-files-found: ignore
