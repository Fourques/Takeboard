name: Native installer previews

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb
            extension: deb
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb
            extension: deb
          - os: macos-15-intel
            platform: macos-x64
            rust_target: x86_64-apple-darwin
            bundles: dmg
            extension: dmg
          - os: macos-15
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
            extension: dmg
          - os: windows-latest
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis
            extension: exe
          - os: windows-11-arm
            platform: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis
            extension: exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled runtime
        run: pnpm desktop:prepare
        env:
          TAKEBOARD_DESKTOP_TARGET: ${{ matrix.rust_target }}
      - name: Compile and bundle desktop app
        run: pnpm --filter @takeboard/desktop exec tauri build --verbose --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --ci -- --locked
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Verify runtime from the final macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          images=(apps/desktop/src-tauri/target/$RUST_TARGET/release/bundle/dmg/*.dmg)
          test "${#images[@]}" -eq 1 && test -f "${images[0]}"
          mount=$(mktemp -d "$RUNNER_TEMP/takeboard-dmg.XXXXXX")
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "${images[0]}"
          node scripts/verify-desktop-runtime.mjs "$mount/TakeBoard.app/Contents/MacOS/takeboard-node" "$mount/TakeBoard.app/Contents/Resources/TakeBoard"
      - name: Install Windows package and verify the installed runtime
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          $installers = @(Get-ChildItem "apps/desktop/src-tauri/target/$env:RUST_TARGET/release/bundle/nsis/*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          $destination = Join-Path $env:RUNNER_TEMP 'TakeBoard-preview-install'
          $installed = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          node scripts/verify-desktop-runtime.mjs "$destination/takeboard-node.exe" "$destination/TakeBoard"
          if ($LASTEXITCODE -ne 0) { throw "Installed runtime verification failed" }
      - name: Install Debian package and verify the installed runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          sudo apt-get install -y ./apps/desktop/src-tauri/target/$RUST_TARGET/release/bundle/deb/*.deb
          node scripts/verify-desktop-runtime.mjs /usr/bin/takeboard-node /usr/lib/TakeBoard/TakeBoard
      - name: Write SHA-256 checksums
        run: node scripts/write-desktop-checksums.mjs apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
      - name: Attest desktop installers
        uses: actions/attest@v4
        with:
          subject-path: "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.${{ matrix.extension }}"
      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: takeboard-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.${{ matrix.extension }}
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.sha256
          if-no-files-found: error
