name: Release bundles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Bundle (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-15
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: windows-11-arm
            platform: windows-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:portable
        env:
          TAKEBOARD_BUNDLE_TARGET: ${{ matrix.platform }}
      - name: Verify checksum
        run: pnpm bundle:verify
      - name: Attest portable bundle
        uses: actions/attest@v4
        with:
          subject-path: "release/*.tar.gz"
      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: takeboard-portable-${{ matrix.platform }}
          path: |
            release/*.tar.gz
            release/*.sha256

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
            bundles: appimage,deb
          - os: macos-15-intel
            platform: macos-x64
            rust_target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            platform: macos-arm64
            rust_target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: windows-11-arm
            platform: windows-arm64
            rust_target: aarch64-pc-windows-msvc
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Prepare bundled runtime
        run: pnpm desktop:prepare
        env:
          TAKEBOARD_DESKTOP_TARGET: ${{ matrix.rust_target }}
      - name: Compile and bundle desktop app
        run: pnpm --filter @takeboard/desktop exec tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
      - name: Write SHA-256 checksums
        run: node scripts/write-desktop-checksums.mjs apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle
      - name: Attest desktop installers
        uses: actions/attest@v4
        with:
          subject-path: "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*"
      - name: Upload desktop installers
        uses: actions/upload-artifact@v7
        with:
          name: takeboard-desktop-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*.sha256
          if-no-files-found: error

  publish:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, desktop, demo]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "takeboard-*"
          path: release
          merge-multiple: true
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            extra=""
            case "${GITHUB_REF_NAME}" in *-*) extra="--prerelease";; esac
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes ${extra}
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber

  demo:
    name: Deterministic product walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm demo:capture
      - name: Attest demo media
        uses: actions/attest@v4
        with:
          subject-path: "test-results/demo/*"
      - name: Upload demo video
        uses: actions/upload-artifact@v7
        with:
          name: demo-video
          path: "test-results/demo/takeboard-product-walkthrough.webm"
          archive: false
      - name: Upload demo cover
        uses: actions/upload-artifact@v7
        with:
          name: demo-cover
          path: "test-results/demo/takeboard-demo-cover.png"
          archive: false
      - name: Upload demo manifest
        uses: actions/upload-artifact@v7
        with:
          name: demo-manifest
          path: "test-results/demo/takeboard-demo-manifest.json"
          archive: false
