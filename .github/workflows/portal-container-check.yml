name: Portal container check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/portal/**"
      - "packages/identity/**"
      - "packages/portal-protocol/**"
      - "deploy/portal/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/portal-container-check.yml"
  pull_request:
    paths:
      - "apps/portal/**"
      - "packages/identity/**"
      - "packages/portal-protocol/**"
      - "deploy/portal/**"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/portal-container-check.yml"

permissions:
  contents: read

concurrency:
  group: portal-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Non-root read-only runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker compose -p takeboard-portal-ci -f deploy/portal/compose.yaml build
        env:
          TAKEBOARD_PORTAL_IMAGE_TAG: ci
          TAKEBOARD_PORTAL_ENV_FILE: .env.example
      - name: Start isolated Portal
        run: |
          mkdir -p deploy/portal/data
          docker compose -p takeboard-portal-ci -f deploy/portal/compose.yaml up -d --wait --wait-timeout 90
        env:
          TAKEBOARD_PORTAL_IMAGE_TAG: ci
          TAKEBOARD_PORTAL_ENV_FILE: .env.example
      - name: Require a healthy least-privilege container
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' takeboard-portal-ci-portal-1)"
            if [ "$status" = "healthy" ]; then break; fi
            if [ "$status" = "unhealthy" ]; then docker logs takeboard-portal-ci-portal-1; exit 1; fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' takeboard-portal-ci-portal-1)" = "healthy"
          test "$(docker inspect --format '{{.Config.User}}' takeboard-portal-ci-portal-1)" = "takeboard-portal"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' takeboard-portal-ci-portal-1)" = "true"
          test "$(stat -c '%u:%g:%a' deploy/portal/data)" = "10001:10001:700"
      - name: Stop gracefully
        run: docker stop --timeout 20 takeboard-portal-ci-portal-1
      - name: Show logs on failure
        if: failure()
        run: docker logs takeboard-portal-ci-portal-1 || true
      - name: Remove smoke container
        if: always()
        run: docker compose -p takeboard-portal-ci -f deploy/portal/compose.yaml down
        env:
          TAKEBOARD_PORTAL_IMAGE_TAG: ci
          TAKEBOARD_PORTAL_ENV_FILE: .env.example
