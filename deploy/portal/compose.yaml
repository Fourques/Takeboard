services:
  portal-data-init:
    image: takeboard-portal:${TAKEBOARD_PORTAL_IMAGE_TAG:-local}
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chown 10001:10001 /data && chmod 0700 /data"]
    volumes:
      - ./data:/data
    read_only: true
    network_mode: none
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    restart: "no"
  portal:
    build:
      context: ../..
      dockerfile: deploy/portal/Dockerfile
    image: takeboard-portal:${TAKEBOARD_PORTAL_IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      portal-data-init:
        condition: service_completed_successfully
    env_file:
      - ${TAKEBOARD_PORTAL_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      TAKEBOARD_PORTAL_BIND_HOST: 0.0.0.0
      TAKEBOARD_PORTAL_PORT: 49200
      TAKEBOARD_PORTAL_DATABASE: /var/lib/takeboard-portal/portal.db
    ports:
      - "127.0.0.1:${TAKEBOARD_PORTAL_HOST_PORT:-49200}:49200"
    volumes:
      - ./data:/var/lib/takeboard-portal
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
